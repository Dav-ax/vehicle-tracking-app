trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Instalar Node.js'

- script: |
    npm install
  displayName: 'Instalar dependencias'

- script: |
    npm test
  displayName: 'Ejecutar pruebas'

- script: |
    npm start &
    sleep 10
  displayName: 'Iniciar servidor para validación'

- script: |
    cd frontend
    npm install
    npm run build
  displayName: 'Compilar frontend React'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'frontend/build'
    ArtifactName: 'drop'
    publishLocation: 'Container'